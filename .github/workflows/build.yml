name: Build and test
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { compiler: g++, type: Release, sanitizer: none, sz3: 'ON' }
          - { compiler: clang++, type: Debug, sanitizer: address, sz3: 'ON' }
          - { compiler: clang++, type: Debug, sanitizer: undefined, sz3: 'OFF' }
          - { compiler: clang++-18, type: Debug, sanitizer: thread, sz3: 'ON' }
    name: ${{ matrix.compiler }} / ${{ matrix.type }} / ${{ matrix.sanitizer }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install NumPy for the independent checker
        run: |
          python3 -m venv "$RUNNER_TEMP/qoiw-python"
          "$RUNNER_TEMP/qoiw-python/bin/python" -m pip install numpy
      - name: Install OpenMP-aware ThreadSanitizer
        if: matrix.sanitizer == 'thread'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 libomp-18-dev libclang-rt-18-dev
      - name: Configure
        env:
          CXX: ${{ matrix.compiler }}
          CC: ${{ matrix.sanitizer == 'thread' && 'clang-18' || 'gcc' }}
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.type }}
          -DQOIW_WARNINGS_AS_ERRORS=ON -DQOIW_SANITIZE=${{ matrix.sanitizer }}
          -DQOIW_CORE_SZ3=${{ matrix.sz3 }}
          -DPython3_EXECUTABLE="$RUNNER_TEMP/qoiw-python/bin/python"
          ${{ matrix.sanitizer == 'thread' && '-DCMAKE_REQUIRE_FIND_PACKAGE_OpenMP=ON' || '' }}
      - run: cmake --build build --parallel
      - name: Test
        if: matrix.sanitizer != 'thread'
        run: ctest --test-dir build --output-on-failure
      - name: Test with ThreadSanitizer and Archer
        if: matrix.sanitizer == 'thread'
        env:
          OMP_TOOL_LIBRARIES: /usr/lib/llvm-18/lib/libarcher.so
          TSAN_OPTIONS: ignore_noninstrumented_modules=1
        run: setarch x86_64 -R ctest --test-dir build --output-on-failure
