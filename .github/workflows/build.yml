name: Build and test
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { compiler: g++, type: Release, sanitizer: none, sz3: 'ON' }
          - { compiler: clang++, type: Debug, sanitizer: address, sz3: 'ON' }
          - { compiler: clang++, type: Debug, sanitizer: undefined, sz3: 'OFF' }
          - { compiler: g++, type: Debug, sanitizer: thread, sz3: 'ON' }
    name: ${{ matrix.compiler }} / ${{ matrix.type }} / ${{ matrix.sanitizer }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Configure
        env:
          CXX: ${{ matrix.compiler }}
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.type }}
          -DQOIW_WARNINGS_AS_ERRORS=ON -DQOIW_SANITIZE=${{ matrix.sanitizer }}
          -DQOIW_CORE_SZ3=${{ matrix.sz3 }}
      - run: cmake --build build --parallel
      - name: Test
        if: matrix.sanitizer != 'thread'
        run: ctest --test-dir build --output-on-failure
      - name: Test with ThreadSanitizer
        if: matrix.sanitizer == 'thread'
        # Keep the test processes' mappings out of GCC TSan's shadow address range.
        run: setarch x86_64 -R ctest --test-dir build --output-on-failure
